<style>

.brushes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.brushes button{border-width:2px;color:#1b1f23;font-weight:600;font-size:14px}
.brushes button.on{border-color:var(--fg);outline:2px solid var(--acc)}
.hint{font-size:13px;color:var(--mut);margin:4px 0}

.qa{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.act{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.tr{display:grid;grid-template-columns:64px 1fr 1fr;gap:6px;align-items:center;margin:4px 0}.chk{display:flex;align-items:center;margin:6px 0}dialog input[type=checkbox]{width:auto;margin:0 8px 0 0}.qb{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.note{font-size:12px;color:var(--mut);margin-top:8px}.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700}</style></head><body>
<div class="top"><button id="prev">‹</button><h1 id="title"></h1><button id="next">›</button><button id="rep">📊</button><button id="gear">⚙️</button></div>

function upd(){const f=pd($('rf').value),t=pd($('rt').value);if(isNaN(f)||isNaN(t)||t<f||(t-f)/864e5>400){$('rs').textContent='Revisa las fechas (máximo ~13 meses).';return null}
 const R=report(f,t),T=R.tot,h=m=>(m/60).toFixed(1).replace('.0','')+' h';
 $('rs').innerHTML='<div class="row"><span>Horas trabajadas</span><b>'+h(T.wk)+'</b></div><div class="row"><span>Horas extras</span><b>'+h(T.ex)+'</b></div><div class="row"><span>Recargos</span><b>'+cop(T.vr)+'</b></div><div class="row"><span>Valor extras</span><b>'+cop(T.ve)+'</b></div><div class="row tot"><span>Total</span><span>'+cop(T.vr+T.ve)+'</span></div>'+(CFG.sal>0?'':'<div class="note">Pon tu salario en ⚙️ para ver los valores en pesos.</div>');
 return R}
function setR(a,b){$('rf').value=iso(a);$('rt').value=iso(b);upd()}
const wkS=o=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()-n.getDay()+o)};
$('rep').onclick=()=>{setR(new Date(Y,M,1),new Date(Y,M+1,0));$('repd').showModal()};
$('rw').onclick=()=>setR(wkS(0),wkS(6));$('rl').onclick=()=>setR(wkS(-7),wkS(-1));$('rm').onclick=()=>setR(new Date(Y,M,1),new Date(Y,M+1,0));
$('rf').onchange=$('rt').onchange=upd;$('rc').onclick=()=>$('repd').close();
$('rd').onclick=()=>{const R=upd();if(!R)return;const a=document.createElement('a');a.href=URL.createObjectURL(xlsx(R));a.download='reporte-turnos_'+$('rf').value+'_a_'+$('rt').value+'.xlsx';document.body.appendChild(a);a.click();a.remove()};
$('gear').onclick=()=>{$('sal').value=CFG.sal||'';$('hrs').value=CFG.hrs;$('tms').innerHTML=['M','T','N','D'].map(id=>{const s=SH.find(x=>x.id===id);return '<div class="tr"><b>'+s.l+'</b><input type="time" data-id="'+id+'" data-i="0" value="'+CFG.t[id][0]+'"><input type="time" data-id="'+id+'" data-i="1" value="'+CFG.t[id][1]+'"></div>'}).join('');$('cfgd').showModal()};
$('cc').onclick=()=>$('cfgd').close();
$('cs').onclick=()=>{CFG.sal=parseFloat($('sal').value)||0;CFG.hrs=parseFloat($('hrs').value)||210;document.querySelectorAll('#tms input').forEach(e=>{if(e.value)CFG.t[e.dataset.id][+e.dataset.i]=e.value});try{localStorage.setItem('turnos-cfg',JSON.stringify(CFG))}catch(e){}$('cfgd').close();render()};
function brushes(){$('brushes').innerHTML='';SH.forEach(s=>{const b=document.createElement('button');b.textContent=s.n;b.style.background=s.c;if(s.id===brush)b.className='on';b.onclick=()=>{brush=s.id;render()};$('brushes').appendChild(b)})}
function render(){
 $('mP').className=mode==='P'?'on':'';$('mE').className=mode==='E'?'on':'';
 $('brushes').style.display=mode==='P'?'flex':'none';
 $('hint').textContent=mode==='P'?'Elige un turno y toca los días para pintarlos.':'Toca un día para registrar sus horas extras.';
 brushes();
 $('title').textContent=new Date(Y,M,1).toLocaleDateString('es',{month:'long',year:'numeric'});
 const g=$('grid');g.innerHTML='';const first=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate();
 for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day empty';g.appendChild(e)}
 const td=new Date();let ot=0,cnt={};
 for(let i=1;i<=n;i++){const k=key(Y,M,i),r=data[k]||{},s=SH.find(x=>x.id===r.s);
  const c=document.createElement('div');c.className='day'+(td.getFullYear()===Y&&td.getMonth()===M&&td.getDate()===i?' today':'')+(new Date(Y,M,i).getDay()===0||r.f?' dom':'');
  if(s)c.style.background=s.c;
  c.innerHTML='<div class="n">'+(r.f?'★ ':'')+i+'</div><div class="t">'+(s?s.l:'')+'</div>'+(r.o?'<div class="o">+'+r.o+'h</div>':'<div></div>');
  if(r.o)ot+=r.o;if(s)cnt[s.n]=(cnt[s.n]||0)+1;
  c.onclick=()=>tap(i);g.appendChild(c)}
 $('ot').textContent=ot+' h';pay();
 $('cnt').innerHTML=Object.entries(cnt).map(([a,b])=>'<div class="row"><span>'+a+'</span><span>'+b+' días</span></div>').join('');
}
function tap(i){const k=key(Y,M,i);
 if(mode==='P'){if(brush==='X'){if(data[k]){delete data[k].s;if(!data[k].o&&!data[k].t&&!data[k].f)delete data[k]}}else if(brush==='F'){const r=data[k]||{};r.f=r.f?undefined:true;data[k]=r;if(!r.s&&!r.o&&!r.t&&!r.f)delete data[k]}else{data[k]=Object.assign(data[k]||{},{s:brush})}save();render()}
 else{sel=k;const r=data[k]||{};$('dt').textContent=i+' de '+new Date(Y,M,1).toLocaleDateString('es',{month:'long'});$('oh').value=r.o||'';$('on').value=r.t||'';$('of').checked=!!r.f;dsh=r.s||null;mkds();prev();$('dlg').showModal()}}
$('ok').onclick=()=>{const h=parseFloat($('oh').value)||0,t=$('on').value.trim();const r=data[sel]||{};r.o=h>0?h:undefined;r.t=t||undefined;r.f=$('of').checked||undefined;r.s=dsh||undefined;data[sel]=r;if(!r.s&&!r.o&&!r.t&&!r.f)delete data[sel];save();$('dlg').close();render()};
$('cx').onclick=()=>$('dlg').close();
document.querySelectorAll('.qa button').forEach(b=>b.onclick=()=>{$('oh').value=b.dataset.h;prev()});
$('mP').onclick=()=>{mode='P';render()};$('mE').onclick=()=>{mode='E';render()};
$('prev').onclick=()=>{M--;if(M<0){M=11;Y--}render()};
$('next').onclick=()=>{M++;if(M>11){M=0;Y++}render()};
render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body></html>
